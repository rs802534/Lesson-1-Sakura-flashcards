<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>桜フラッシュ — Sakura Flash</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#f2c4ce">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="桜フラッシュ">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@300;400;700&family=Zen+Old+Mincho:wght@400;700&family=Sawarabi+Mincho&display=swap" rel="stylesheet">
<style>
*{ box-sizing:border-box; margin:0; padding:0; }
:root{
  --ink:#2c1810; --ink-mid:#5c3d2e; --ink-light:#9c7b6e; --ink-faint:#d4b8b0;
  --paper:#fff8f5; --paper2:#ffeef5; --paper3:#ffe0ed;
  --pk1:#ff85a1; --pk2:#ff4d82; --pk3:#e8006f;
  --coral:#ff7c5c; --peach:#ffb347; --gold:#e8a020;
  --purple:#c06090; --magenta:#e040a0; --deep:#8b1a5a;
  --lavender:#d080c0; --rose:#ff2d78;
}

body{ background:#fff0f5; color:var(--ink); font-family:'Sawarabi Mincho',serif; min-height:100vh; overflow-x:hidden; position:relative; }

/* ── LAYERED BACKGROUND ── */
.bg-base{
  position:fixed; inset:0; z-index:0; pointer-events:none;
  background:
    radial-gradient(ellipse 80% 60% at 0% 0%,   #ffb3cc 0%, transparent 55%),
    radial-gradient(ellipse 60% 50% at 100% 0%,  #ff80ab 0%, transparent 50%),
    radial-gradient(ellipse 50% 60% at 50% 50%,  #ffd6e8 0%, transparent 60%),
    radial-gradient(ellipse 70% 50% at 0% 100%,  #ffaad4 0%, transparent 55%),
    radial-gradient(ellipse 60% 40% at 100% 100%,#ff85c2 0%, transparent 50%),
    radial-gradient(ellipse 40% 30% at 30% 70%,  #ffcce0 0%, transparent 50%),
    radial-gradient(ellipse 30% 40% at 70% 30%,  #ffc0d8 0%, transparent 45%),
    linear-gradient(135deg, #ffe0ec 0%, #ffd0e8 30%, #ffb8d8 60%, #ffa0cc 100%);
}

/* watercolour paint splashes */
.bg-splash{
  position:fixed; inset:0; z-index:0; pointer-events:none;
  background:
    radial-gradient(circle 200px at 15% 20%,  #ff69b480 0%, transparent 70%),
    radial-gradient(circle 150px at 80% 15%,  #ff1493aa 0%, transparent 70%),
    radial-gradient(circle 180px at 90% 60%,  #ff85a160 0%, transparent 70%),
    radial-gradient(circle 160px at 10% 75%,  #c0608090 0%, transparent 70%),
    radial-gradient(circle 200px at 50% 90%,  #ff4d8270 0%, transparent 70%),
    radial-gradient(circle 120px at 35% 45%,  #ffb34750 0%, transparent 70%),
    radial-gradient(circle 140px at 65% 75%,  #e040a060 0%, transparent 70%);
  filter: blur(30px);
}

/* sakura tree silhouette */
.bg-tree{
  position:fixed; bottom:0; left:50%; transform:translateX(-50%);
  z-index:0; pointer-events:none; opacity:0.12; width:100%; text-align:center;
}
.bg-tree svg{ width:100%; max-width:800px; height:auto; }

/* ── FALLING PETALS ── */
.petals{ position:fixed; inset:0; z-index:1; pointer-events:none; overflow:hidden; }
.petal{
  position:absolute; top:-30px; pointer-events:none;
  animation:fall linear infinite;
  filter:drop-shadow(0 2px 4px rgba(200,80,120,0.3));
}
@keyframes fall{
  0%  { transform:translateY(-30px) rotate(0deg) translateX(0px); opacity:0; }
  8%  { opacity:1; }
  90% { opacity:0.7; }
  100%{ transform:translateY(110vh) rotate(900deg) translateX(80px); opacity:0; }
}

/* ── APP ── */
.app{ position:relative; z-index:2; max-width:720px; margin:0 auto; padding:20px 16px 80px; }

/* HEADER */
.topbar{
  text-align:center; margin-bottom:20px; padding:20px 16px 16px;
  background:rgba(255,255,255,0.55);
  backdrop-filter:blur(12px);
  border-radius:20px;
  border:1px solid rgba(255,180,210,0.5);
  box-shadow:0 4px 24px rgba(220,80,140,0.15);
}
.logo-jp{
  font-family:'Zen Old Mincho',serif; font-size:32px; font-weight:700;
  background:linear-gradient(135deg,var(--deep) 0%,var(--pk2) 40%,var(--magenta) 70%,var(--coral) 100%);
  -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text;
  letter-spacing:6px; line-height:1.2;
}
.logo-en{ font-size:10px; letter-spacing:5px; color:var(--purple); margin-top:4px; opacity:0.8; }
.petal-deco{ font-size:18px; margin:0 6px; }

/* STREAK */
.streak-bar{
  display:flex; align-items:center; justify-content:center; gap:0;
  background:rgba(255,255,255,0.6); backdrop-filter:blur(10px);
  border:1px solid rgba(255,150,190,0.4);
  border-radius:50px; padding:10px 20px; margin-bottom:16px;
  box-shadow:0 2px 16px rgba(220,80,140,0.12);
}
.streak-col{ text-align:center; padding:0 18px; }
.streak-num{ font-family:'Zen Old Mincho',serif; font-size:24px; line-height:1; }
.streak-num.fire{ color:var(--coral); }
.streak-num.known{ color:#2e7d4f; }
.streak-num.total{ color:var(--purple); }
.streak-label{ font-size:9px; color:var(--ink-light); margin-top:2px; letter-spacing:1px; }
.streak-div{ width:1px; height:36px; background:rgba(220,120,170,0.3); }

/* WORD OF THE DAY */
.wotd{
  position:relative; overflow:hidden;
  background:rgba(255,255,255,0.65); backdrop-filter:blur(12px);
  border:1px solid rgba(255,130,180,0.4);
  border-radius:16px; padding:18px 20px; margin-bottom:16px;
  box-shadow:0 4px 20px rgba(220,80,140,0.15);
}
.wotd::before{
  content:''; position:absolute; top:-30px; right:-30px;
  width:140px; height:140px; border-radius:50%;
  background:radial-gradient(circle,#ff80ab40,transparent 70%);
}
.wotd::after{
  content:''; position:absolute; bottom:-20px; left:-20px;
  width:100px; height:100px; border-radius:50%;
  background:radial-gradient(circle,#ffb34740,transparent 70%);
}
.wotd-badge{
  display:inline-block; font-size:9px; letter-spacing:3px;
  background:linear-gradient(135deg,var(--pk2),var(--magenta));
  color:#fff; padding:3px 12px; border-radius:20px; margin-bottom:10px;
}
.wotd-kanji{
  font-family:'Zen Old Mincho',serif; font-size:40px; font-weight:700;
  background:linear-gradient(135deg,var(--deep),var(--pk2));
  -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text;
  line-height:1.1; margin-bottom:4px;
}
.wotd-reading{ font-size:13px; color:var(--purple); margin-bottom:3px; letter-spacing:2px; }
.wotd-meaning{ font-size:15px; color:var(--ink-mid); font-weight:400; margin-bottom:8px; }
.wotd-sentence{
  font-size:11px; color:var(--ink-light); line-height:1.8;
  border-top:1px solid rgba(220,120,170,0.25); padding-top:8px; font-style:italic;
}

/* FILTERS */
.filter-wrap{
  background:rgba(255,255,255,0.55); backdrop-filter:blur(10px);
  border:1px solid rgba(255,150,190,0.3); border-radius:14px;
  padding:12px 14px; margin-bottom:14px;
}
.filter-row{ display:flex; flex-wrap:wrap; gap:6px; align-items:center; }
.filter-label{ font-size:9px; letter-spacing:2px; color:var(--ink-faint); margin-right:4px; }
.cat-btn{
  background:rgba(255,255,255,0.6); border:1px solid rgba(220,120,170,0.35);
  color:var(--purple); padding:5px 14px;
  font-family:'Sawarabi Mincho',serif; font-size:11px;
  cursor:pointer; transition:all 0.2s; border-radius:20px;
}
.cat-btn:hover{ border-color:var(--pk2); color:var(--pk2); background:rgba(255,255,255,0.8); }
.cat-btn.active{
  background:linear-gradient(135deg,var(--pk2),var(--magenta));
  border-color:transparent; color:#fff;
  box-shadow:0 2px 12px rgba(220,80,140,0.35);
}
.controls{ display:flex; gap:6px; margin-left:auto; }
.ctrl-btn{
  background:rgba(255,255,255,0.6); border:1px solid rgba(220,120,170,0.35);
  color:var(--purple); padding:5px 12px;
  font-family:'Sawarabi Mincho',serif; font-size:11px;
  cursor:pointer; transition:all 0.2s; border-radius:20px;
}
.ctrl-btn:hover{ border-color:var(--pk2); color:var(--pk2); }
.ctrl-btn.on{
  background:linear-gradient(135deg,var(--coral),var(--peach));
  border-color:transparent; color:#fff;
}

/* PROGRESS */
.prog-wrap{
  background:rgba(255,255,255,0.5); backdrop-filter:blur(8px);
  border:1px solid rgba(255,150,190,0.25); border-radius:12px;
  padding:10px 14px; margin-bottom:14px;
}
.prog-row{ display:flex; align-items:center; gap:8px; margin-bottom:5px; }
.prog-row:last-child{ margin-bottom:0; }
.prog-name{ width:80px; font-size:9px; letter-spacing:1px; color:var(--ink-light); flex-shrink:0; }
.prog-track{ flex:1; height:6px; background:rgba(220,120,170,0.15); border-radius:6px; overflow:hidden; }
.prog-fill{
  height:100%; border-radius:6px;
  background:linear-gradient(90deg,var(--pk1),var(--magenta),var(--coral));
  box-shadow:0 0 6px rgba(220,80,140,0.4);
  transition:width 0.6s cubic-bezier(0.34,1.56,0.64,1);
}
.prog-count{ width:30px; text-align:right; font-size:9px; color:var(--ink-light); }

/* COUNTER */
.counter{ text-align:center; font-size:11px; letter-spacing:3px; color:rgba(180,100,140,0.6); margin-bottom:14px; }
.counter span{ font-family:'Zen Old Mincho',serif; font-size:16px; color:var(--pk2); }

/* ── CARD ── */
.card-area{ perspective:1400px; margin-bottom:14px; cursor:pointer; }
.card-3d{
  position:relative; width:100%;
  transform-style:preserve-3d;
  transition:transform 0.65s cubic-bezier(0.23,1,0.32,1);
}
.card-3d.flipped{ transform:rotateY(180deg); }
.card-face{
  backface-visibility:hidden; -webkit-backface-visibility:hidden;
  background:rgba(255,255,255,0.72);
  backdrop-filter:blur(16px);
  border:1px solid rgba(255,150,190,0.5);
  border-radius:20px; padding:36px 28px;
  min-height:270px; display:flex; flex-direction:column;
  align-items:center; justify-content:center;
  position:relative; overflow:hidden;
  box-shadow:0 8px 32px rgba(220,80,140,0.18), 0 2px 8px rgba(220,80,140,0.1);
  transition:border-color 0.2s, box-shadow 0.2s;
}
/* colourful corner blobs */
.card-face::before{
  content:''; position:absolute; top:-40px; right:-40px;
  width:160px; height:160px; border-radius:50%;
  background:radial-gradient(circle,#ff80ab50,#ffb34730 50%,transparent 70%);
  pointer-events:none;
}
.card-face::after{
  content:''; position:absolute; bottom:-40px; left:-40px;
  width:140px; height:140px; border-radius:50%;
  background:radial-gradient(circle,#c0609050,#ff4d8230 50%,transparent 70%);
  pointer-events:none;
}
.card-back{ position:absolute; top:0; left:0; width:100%; transform:rotateY(180deg); }

/* card top accent bar */
.card-bar{
  position:absolute; top:0; left:0; right:0; height:4px; border-radius:20px 20px 0 0;
  background:linear-gradient(90deg,var(--pk1),var(--magenta),var(--coral),var(--peach),var(--lavender));
}
.card-cat{
  position:absolute; top:14px; left:16px; font-size:9px; letter-spacing:2px;
  background:linear-gradient(135deg,var(--pk2),var(--magenta));
  -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text;
  opacity:0.8;
}
.card-hint{ position:absolute; bottom:12px; right:16px; font-size:10px; color:rgba(180,100,140,0.5); letter-spacing:1px; }
.known-badge{
  position:absolute; top:12px; right:14px; font-size:9px;
  padding:2px 10px; border-radius:20px;
  background:linear-gradient(135deg,#56ab6e,#2e7d4f);
  color:#fff; display:none;
  box-shadow:0 2px 8px rgba(46,125,79,0.3);
}
.card-face.is-known .known-badge{ display:block; }

.kanji-main{
  font-family:'Zen Old Mincho',serif; font-size:72px; font-weight:700;
  background:linear-gradient(135deg,var(--deep) 0%,var(--pk2) 45%,var(--magenta) 80%);
  -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text;
  line-height:1; margin-bottom:12px; text-align:center;
}
.reading-main{
  font-family:'Noto Serif JP',serif; font-size:17px; font-weight:300;
  color:var(--purple); letter-spacing:4px; text-align:center; margin-bottom:4px;
}
.reading-romaji{ font-size:12px; color:var(--ink-light); letter-spacing:2px; text-align:center; }

/* BACK FACE */
.back-meaning{
  font-family:'Zen Old Mincho',serif; font-size:28px;
  background:linear-gradient(135deg,var(--deep),var(--pk2));
  -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text;
  margin-bottom:6px; text-align:center; line-height:1.3;
}
.back-sub{ font-size:13px; color:var(--purple); letter-spacing:2px; text-align:center; margin-bottom:4px; }
.back-divider{
  width:80px; height:2px; margin:10px auto;
  background:linear-gradient(90deg,transparent,var(--pk1),var(--magenta),var(--coral),transparent);
  border-radius:2px;
}
.back-context{ font-size:12px; color:var(--ink-light); text-align:center; line-height:1.8; max-width:380px; margin-bottom:8px; }
.back-sentence{
  font-size:11px; color:var(--ink-mid); text-align:center; line-height:1.9;
  background:rgba(255,180,210,0.2); border-radius:10px;
  padding:8px 14px; border-left:3px solid var(--pk1);
  max-width:400px; font-style:italic;
}

/* FLIP HINT */
.flip-hint{
  text-align:center; font-size:10px;
  background:linear-gradient(135deg,var(--pk2),var(--magenta),var(--coral));
  -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text;
  letter-spacing:2px; margin-bottom:10px; opacity:0.7;
}

/* ACTIONS */
.actions{ display:flex; gap:8px; justify-content:center; margin-bottom:12px; flex-wrap:wrap; }
.act-btn{
  background:rgba(255,255,255,0.65); backdrop-filter:blur(8px);
  border:1px solid rgba(220,120,170,0.4);
  padding:10px 18px; font-family:'Sawarabi Mincho',serif;
  font-size:11px; letter-spacing:1px; cursor:pointer;
  transition:all 0.2s; border-radius:25px; color:var(--ink-mid);
  box-shadow:0 2px 8px rgba(220,80,140,0.1);
}
.btn-known{ border-color:rgba(46,125,79,0.5); color:#2e7d4f; }
.btn-known:hover{ background:rgba(46,125,79,0.12); box-shadow:0 4px 14px rgba(46,125,79,0.25); transform:translateY(-1px); }
.btn-learning{ border-color:rgba(220,80,140,0.5); color:var(--pk2); }
.btn-learning:hover{ background:rgba(255,100,160,0.1); transform:translateY(-1px); }
.btn-speak{ border-color:rgba(180,100,200,0.4); color:var(--purple); }
.btn-speak:hover{ background:rgba(180,100,200,0.1); transform:translateY(-1px); }
.btn-nav{ border-color:rgba(220,120,170,0.35); color:var(--purple); }
.btn-nav:hover{ border-color:var(--pk2); color:var(--pk2); transform:translateY(-1px); }
@keyframes pulse-speak{ 0%{box-shadow:0 0 0 0 rgba(180,100,200,0.5)} 70%{box-shadow:0 0 0 10px transparent} 100%{box-shadow:0 0 0 0 transparent} }
.btn-speak.speaking{ animation:pulse-speak 0.9s infinite; background:rgba(180,100,200,0.15); }

/* KB HINT */
.kb-hint{ text-align:center; font-size:9px; color:rgba(180,100,140,0.45); letter-spacing:2px; }
.kb-hint span{ border:1px solid rgba(220,120,170,0.3); padding:1px 5px; border-radius:4px; margin:0 2px; }

/* LOADING */
.loading{
  text-align:center; padding:80px 20px;
  font-family:'Zen Old Mincho',serif; font-size:14px;
  background:linear-gradient(135deg,var(--pk2),var(--magenta));
  -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text;
  letter-spacing:3px;
}
@keyframes blink{0%,100%{opacity:0.3}50%{opacity:1}}
.loading span{ animation:blink 1.4s infinite; }
.empty-state{ text-align:center; padding:60px 20px; font-size:13px; color:var(--ink-faint); }

/* CARD ENTRANCE */
@keyframes cardIn{ from{opacity:0;transform:translateY(16px) scale(0.98)} to{opacity:1;transform:translateY(0) scale(1)} }
.card-area{ animation:cardIn 0.35s cubic-bezier(0.34,1.56,0.64,1); }
</style>
</head>
<body>

<!-- BACKGROUNDS -->
<div class="bg-base"></div>
<div class="bg-splash"></div>

<!-- SAKURA TREE SVG SILHOUETTE -->
<div class="bg-tree">
  <svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg" fill="#c0305880">
    <ellipse cx="400" cy="120" rx="280" ry="130"/>
    <ellipse cx="220" cy="160" rx="160" ry="100"/>
    <ellipse cx="580" cy="150" rx="170" ry="110"/>
    <ellipse cx="320" cy="90"  rx="140" ry="80"/>
    <ellipse cx="500" cy="80"  rx="130" ry="75"/>
    <ellipse cx="150" cy="200" rx="120" ry="80"/>
    <ellipse cx="650" cy="190" rx="130" ry="85"/>
    <rect x="385" y="240" width="30" height="160" rx="8" fill="#8b4513a0"/>
    <rect x="300" y="300" width="18" height="100" rx="6" fill="#8b4513a0" transform="rotate(-20,309,300)"/>
    <rect x="480" y="290" width="18" height="110" rx="6" fill="#8b4513a0" transform="rotate(15,489,290)"/>
  </svg>
</div>

<!-- PETALS -->
<div class="petals" id="petals"></div>

<div class="app">

  <!-- HEADER -->
  <div class="topbar">
    <div class="logo-jp"><span class="petal-deco">🌸</span>桜フラッシュ<span class="petal-deco">🌸</span></div>
    <div class="logo-en">SAKURA FLASH · JAPANESE VOCABULARY</div>
  </div>

  <!-- STREAK / STATS -->
  <div class="streak-bar">
    <div class="streak-col">
      <div class="streak-num fire" id="streak-num">0</div>
      <div class="streak-label">🔥 DAY STREAK</div>
    </div>
    <div class="streak-div"></div>
    <div class="streak-col">
      <div class="streak-num known" id="stat-known">0</div>
      <div class="streak-label">✓ KNOWN</div>
    </div>
    <div class="streak-div"></div>
    <div class="streak-col">
      <div class="streak-num total" id="stat-total">0</div>
      <div class="streak-label">🌸 TOTAL</div>
    </div>
  </div>

  <!-- WORD OF THE DAY -->
  <div class="wotd">
    <div class="wotd-badge">✦ WORD OF THE DAY · 今日の一言 ✦</div>
    <div class="wotd-kanji"  id="wotd-kanji">—</div>
    <div class="wotd-reading"  id="wotd-reading"></div>
    <div class="wotd-meaning"  id="wotd-meaning"></div>
    <div class="wotd-sentence" id="wotd-sentence"></div>
  </div>

  <!-- FILTERS -->
  <div class="filter-wrap">
    <div class="filter-row" id="filters">
      <span class="filter-label">Category</span>
      <button class="cat-btn active" data-cat="ALL">All 🌸</button>
      <div class="controls">
        <button class="ctrl-btn" id="btn-shuffle">⇄ Shuffle</button>
        <button class="ctrl-btn" id="btn-hide-known">Hide Known</button>
      </div>
    </div>
  </div>

  <!-- PROGRESS -->
  <div class="prog-wrap">
    <div id="cat-progress"></div>
  </div>

  <!-- COUNTER -->
  <div class="counter" id="counter"></div>

  <!-- CARD -->
  <div class="card-area" id="card-area">
    <div class="loading"><span>桜を読み込み中…</span></div>
  </div>

  <div class="flip-hint" id="flip-hint">✿ tap card to reveal meaning ✿</div>

  <!-- ACTIONS -->
  <div class="actions">
    <button class="act-btn btn-nav"      onclick="navigate(-1)">◀ Prev</button>
    <button class="act-btn btn-speak"    id="btn-speak" onclick="speakCard()">♪ Listen</button>
    <button class="act-btn btn-known"    onclick="markKnown()">✓ Known</button>
    <button class="act-btn btn-learning" onclick="markLearning()">✕ Learning</button>
    <button class="act-btn btn-nav"      onclick="navigate(1)">Next ▶</button>
  </div>

  <div class="kb-hint">
    <span>←→</span> navigate &nbsp;
    <span>Space</span> flip &nbsp;
    <span>K</span> known &nbsp;
    <span>X</span> learning &nbsp;
    <span>S</span> speak
  </div>

</div>

<script>
/* ── SERVICE WORKER ── */
if('serviceWorker' in navigator){
  window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
}

/* ── PETALS ── */
const PETALS_SVG=[
  `<svg width="18" height="16" viewBox="0 0 18 16"><ellipse cx="9" cy="8" rx="8" ry="5" fill="#ff85a1" opacity="0.85" transform="rotate(-20 9 8)"/></svg>`,
  `<svg width="16" height="18" viewBox="0 0 16 18"><ellipse cx="8" cy="9" rx="5" ry="8" fill="#ff4d82" opacity="0.8" transform="rotate(15 8 9)"/></svg>`,
  `<svg width="20" height="14" viewBox="0 0 20 14"><ellipse cx="10" cy="7" rx="9" ry="5" fill="#e040a0" opacity="0.75" transform="rotate(-35 10 7)"/></svg>`,
  `<svg width="14" height="18" viewBox="0 0 14 18"><ellipse cx="7" cy="9" rx="5" ry="8" fill="#c06090" opacity="0.8" transform="rotate(25 7 9)"/></svg>`,
  `<svg width="22" height="16" viewBox="0 0 22 16"><ellipse cx="11" cy="8" rx="10" ry="5" fill="#ffb3cc" opacity="0.9" transform="rotate(10 11 8)"/></svg>`,
  `<svg width="16" height="20" viewBox="0 0 16 20"><ellipse cx="8" cy="10" rx="5" ry="9" fill="#ff2d78" opacity="0.7" transform="rotate(-15 8 10)"/></svg>`,
  `<svg width="18" height="18" viewBox="0 0 24 24"><path d="M12 2 C14 6 18 8 18 12 C18 16 14 18 12 22 C10 18 6 16 6 12 C6 8 10 6 12 2Z" fill="#ffaad4" opacity="0.8"/></svg>`,
  `<svg width="20" height="20" viewBox="0 0 20 20"><circle cx="10" cy="10" r="7" fill="none" stroke="#ff69b4" stroke-width="1.5" opacity="0.6"/><circle cx="10" cy="10" r="3" fill="#ff69b4" opacity="0.7"/></svg>`,
];
function spawnPetal(){
  const el=document.createElement('div');
  el.className='petal';
  el.innerHTML=PETALS_SVG[Math.floor(Math.random()*PETALS_SVG.length)];
  el.style.left=Math.random()*100+'vw';
  el.style.opacity=(0.5+Math.random()*0.5).toString();
  const dur=7+Math.random()*12;
  el.style.animationDuration=dur+'s';
  el.style.animationDelay=(Math.random()*dur)+'s';
  const scale=0.6+Math.random()*0.9;
  el.style.transform=`scale(${scale})`;
  document.getElementById('petals').appendChild(el);
  setTimeout(()=>el.remove(),(dur+3)*1000);
}
for(let i=0;i<16;i++) setTimeout(()=>spawnPetal(),i*500);
setInterval(spawnPetal,1800);

/* ── STREAK ── */
function getTodayStr(){ return new Date().toISOString().slice(0,10); }
function loadStreak(){
  const today=getTodayStr();
  let d=JSON.parse(localStorage.getItem('sakura-streak')||'{"streak":0,"last":""}');
  const yesterday=new Date(); yesterday.setDate(yesterday.getDate()-1);
  const yStr=yesterday.toISOString().slice(0,10);
  if(d.last===today) return d.streak;
  d.streak = d.last===yStr ? d.streak+1 : 1;
  d.last=today;
  localStorage.setItem('sakura-streak',JSON.stringify(d));
  return d.streak;
}
document.getElementById('streak-num').textContent=loadStreak();

/* ── DATA ── */
let ALL_CARDS=[], deck=[], currentCat="ALL", currentIdx=0;
let isFlipped=false, hideKnown=false;
let knownSet=new Set(), learningSet=new Set();
function getKey(c){ return c.cat+'|'+c.kanji; }

/* ── WORD OF DAY ── */
function setWOTD(cards){
  if(!cards.length) return;
  const w=cards[Math.floor(Date.now()/86400000)%cards.length];
  document.getElementById('wotd-kanji').textContent=w.kanji;
  document.getElementById('wotd-reading').textContent=w.reading;
  document.getElementById('wotd-meaning').textContent=w.meaning;
  document.getElementById('wotd-sentence').textContent=w.sentence||'';
}

/* ── LOAD ── */
async function loadWords(){
  try{
    const res=await fetch('sakura-words.json?v='+Date.now());
    if(!res.ok) throw new Error();
    ALL_CARDS=await res.json();
    setWOTD(ALL_CARDS);
    document.getElementById('stat-total').textContent=ALL_CARDS.length;
    buildCatBtns();
    render();
  }catch(e){
    document.getElementById('card-area').innerHTML='<div class="empty-state">🌸 Could not load sakura-words.json</div>';
  }
}

/* ── CATEGORY BUTTONS ── */
function buildCatBtns(){
  const cats=[...new Set(ALL_CARDS.map(c=>c.cat))];
  const el=document.getElementById('filters');
  const ctrl=document.querySelector('.controls');
  el.querySelectorAll('.cat-btn:not([data-cat="ALL"])').forEach(b=>b.remove());
  cats.forEach(cat=>{
    const btn=document.createElement('button');
    btn.className='cat-btn'; btn.dataset.cat=cat; btn.textContent=cat;
    btn.addEventListener('click',()=>{
      document.querySelectorAll('.cat-btn').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active'); currentCat=cat; currentIdx=0; render();
    });
    el.insertBefore(btn,ctrl);
  });
  document.querySelector('.cat-btn[data-cat="ALL"]').addEventListener('click',function(){
    document.querySelectorAll('.cat-btn').forEach(b=>b.classList.remove('active'));
    this.classList.add('active'); currentCat="ALL"; currentIdx=0; render();
  });
}

/* ── DECK ── */
function buildDeck(){
  deck=currentCat==="ALL"?[...ALL_CARDS]:ALL_CARDS.filter(c=>c.cat===currentCat);
  if(hideKnown) deck=deck.filter(c=>!knownSet.has(getKey(c)));
  if(currentIdx>=deck.length) currentIdx=Math.max(0,deck.length-1);
}

/* ── PROGRESS ── */
function buildProgress(){
  const cats=[...new Set(ALL_CARDS.map(c=>c.cat))];
  const el=document.getElementById('cat-progress'); el.innerHTML='';
  cats.forEach(cat=>{
    const total=ALL_CARDS.filter(c=>c.cat===cat).length;
    const known=ALL_CARDS.filter(c=>c.cat===cat&&knownSet.has(getKey(c))).length;
    const pct=total?Math.round(known/total*100):0;
    const row=document.createElement('div'); row.className='prog-row';
    row.innerHTML=`<div class="prog-name">${cat}</div>
      <div class="prog-track"><div class="prog-fill" style="width:${pct}%"></div></div>
      <div class="prog-count">${known}/${total}</div>`;
    el.appendChild(row);
  });
}

/* ── CARD HTML ── */
function cardHTML(){
  return `<div class="card-3d" id="card-3d">
    <div class="card-face" id="card-front">
      <div class="card-bar"></div>
      <div class="card-cat" id="front-cat"></div>
      <div class="known-badge">✓ Known</div>
      <div class="kanji-main" id="front-kanji"></div>
      <div class="reading-main" id="front-reading"></div>
      <div class="reading-romaji" id="front-romaji"></div>
      <div class="card-hint">tap to reveal ✿</div>
    </div>
    <div class="card-face card-back" id="card-back">
      <div class="card-bar"></div>
      <div class="card-cat" id="back-cat"></div>
      <div class="back-sub" id="back-sub"></div>
      <div class="back-meaning" id="back-meaning"></div>
      <div class="back-divider"></div>
      <div class="back-context" id="back-context"></div>
      <div class="back-sentence" id="back-sentence"></div>
      <div class="card-hint">tap to flip back ✿</div>
    </div>
  </div>`;
}

/* ── RENDER ── */
function render(){
  buildDeck();
  document.getElementById('stat-known').textContent=knownSet.size;
  document.getElementById('stat-total').textContent=ALL_CARDS.length;
  const area=document.getElementById('card-area');
  if(!deck.length){
    area.innerHTML='<div class="empty-state">No cards 🌸 try a different filter</div>';
    document.getElementById('counter').innerHTML='';
    buildProgress(); return;
  }
  if(!area.querySelector('.card-3d')){
    area.innerHTML=cardHTML(); area.onclick=flipCard;
  }
  const card=deck[currentIdx];
  const known=knownSet.has(getKey(card));
  isFlipped=false;
  document.getElementById('card-3d').classList.remove('flipped');
  document.getElementById('flip-hint').textContent='✿ tap card to reveal meaning ✿';
  document.getElementById('front-cat').textContent=card.cat;
  document.getElementById('front-kanji').textContent=card.kanji;
  document.getElementById('front-reading').textContent=card.reading.split(' ')[0]||card.reading;
  document.getElementById('front-romaji').textContent=card.reading;
  document.getElementById('card-front').className='card-face'+(known?' is-known':'');
  document.getElementById('back-cat').textContent=card.cat;
  document.getElementById('back-sub').textContent=card.kanji+' · '+card.reading;
  document.getElementById('back-meaning').textContent=card.meaning;
  document.getElementById('back-context').textContent=card.context;
  document.getElementById('back-sentence').textContent=card.sentence||'';
  document.getElementById('counter').innerHTML=`<span>${currentIdx+1}</span> / ${deck.length}`;
  buildProgress();
}

function flipCard(){
  if(!deck.length||!document.getElementById('card-3d')) return;
  isFlipped=!isFlipped;
  document.getElementById('card-3d').classList.toggle('flipped',isFlipped);
  document.getElementById('flip-hint').textContent=isFlipped?'✿ tap to flip back ✿':'✿ tap card to reveal meaning ✿';
}
function navigate(dir){
  if(!deck.length) return;
  currentIdx=(currentIdx+dir+deck.length)%deck.length; render();
}
function flashCard(col,shadow){
  const f=document.getElementById('card-front'); if(!f) return;
  f.style.borderColor=col; f.style.boxShadow=`0 0 30px ${shadow}`;
  setTimeout(()=>{ f.style.borderColor=''; f.style.boxShadow=''; },450);
}
function markKnown(){
  if(!deck.length) return;
  knownSet.add(getKey(deck[currentIdx]));
  learningSet.delete(getKey(deck[currentIdx]));
  flashCard('#56ab6e','rgba(46,125,79,0.4)');
  setTimeout(()=>navigate(1),340);
}
function markLearning(){
  if(!deck.length) return;
  learningSet.add(getKey(deck[currentIdx]));
  knownSet.delete(getKey(deck[currentIdx]));
  flashCard('#ff4d82','rgba(220,80,140,0.4)');
  render();
}
function speakCard(){
  if(!deck.length) return;
  const card=deck[currentIdx];
  const btn=document.getElementById('btn-speak');
  if(!('speechSynthesis' in window)){ btn.textContent='No TTS'; return; }
  window.speechSynthesis.cancel();
  const utt=new SpeechSynthesisUtterance(card.kanji+'。'+(card.reading.split(' ')[0]||card.reading));
  utt.lang='ja-JP'; utt.rate=0.8;
  btn.classList.add('speaking'); btn.textContent='♪ Playing';
  utt.onend=utt.onerror=()=>{ btn.classList.remove('speaking'); btn.textContent='♪ Listen'; };
  window.speechSynthesis.speak(utt);
}

document.getElementById('btn-shuffle').addEventListener('click',function(){
  for(let i=ALL_CARDS.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1)); [ALL_CARDS[i],ALL_CARDS[j]]=[ALL_CARDS[j],ALL_CARDS[i]];
  }
  currentIdx=0; render();
  this.style.background='linear-gradient(135deg,#ff4d82,#e040a0)';
  this.style.color='#fff'; this.style.borderColor='transparent';
  setTimeout(()=>{ this.style.background=''; this.style.color=''; this.style.borderColor=''; },600);
});
document.getElementById('btn-hide-known').addEventListener('click',function(){
  hideKnown=!hideKnown; this.classList.toggle('on',hideKnown);
  this.textContent=hideKnown?'Show All':'Hide Known';
  currentIdx=0; render();
});
document.addEventListener('keydown',e=>{
  if(['INPUT','TEXTAREA'].includes(document.activeElement.tagName)) return;
  if(e.key==='ArrowRight'||e.key==='l') navigate(1);
  else if(e.key==='ArrowLeft'||e.key==='h') navigate(-1);
  else if(e.key===' '||e.key==='f'){e.preventDefault();flipCard();}
  else if(e.key==='k') markKnown();
  else if(e.key==='x') markLearning();
  else if(e.key==='s') speakCard();
});

loadWords();
</script>
</body>
</html>
